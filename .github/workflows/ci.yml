name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # The npm bundled with Node 22 calls an audit endpoint the registry is retiring (HTTP 400); npm 11 uses the
      # bulk advisory endpoint.
      - run: npx --yes npm@11 audit --audit-level=moderate
      - run: npm run license-check
